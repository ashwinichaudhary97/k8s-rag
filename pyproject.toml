[project]
name = "k8s-rag"
version = "0.1.0"
description = "Versioned, drift-aware RAG over Kubernetes documentation"
requires-python = ">=3.11"
dependencies = [
    # Config and validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # Logging and tracing
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # Ingestion
    "mistune>=3.0.2",
    "gitpython>=3.1.43",
    # Retrieval
    "qdrant-client>=1.12.0",
    "bm25s>=0.2.0",
    "sentence-transformers>=3.2.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    # Generation
    "openai>=1.52.0",
    "tiktoken>=0.8.0",
    # Evaluation
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    # Serving
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.21.0",
    "sse-starlette>=2.1.0",
    # Kaggle bridge
    "kagglehub>=0.3.0",
    # Utilities
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "langchain-community<0.4.2",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
